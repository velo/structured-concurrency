name: Dependabot auto-merge

# Safe only because main requires the build.yml checks, so --auto waits for them.
# Needs "Allow auto-merge" and "Allow GitHub Actions to create and approve pull requests".
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'velo/structured-concurrency'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN may not merge changes to workflow files, so Actions updates wait for a human.
      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why a workflow update was left open
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: |
          echo "Approved, not queued: merging a workflow change needs a human." >> "$GITHUB_STEP_SUMMARY"
