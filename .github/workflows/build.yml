name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jdk25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify

  jdk28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-jdk28-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-jdk28-
      - run: scripts/verify-jdk28.sh
