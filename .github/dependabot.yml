version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns: ["*-plugin"]
      maven-dependencies:
        patterns: ["*"]
        exclude-patterns: ["*-plugin"]
    ignore:
      - dependency-name: org.apache.maven:apache-maven
        versions: [">=3.10.0"]
  - package-ecosystem: docker
    directory: /jdk28
    schedule:
      interval: daily
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
